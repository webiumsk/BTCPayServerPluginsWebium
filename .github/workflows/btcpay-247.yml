name: BTCPay 2.4.7 compatibility
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cashu_safety
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cashu-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashu_safety"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CASHUMELT_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=cashu_safety;Username=postgres;Password=cashu-test-only
      TICKETS_ORDER_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=satflux_tickets_ordering_ci;Username=postgres;Password=cashu-test-only
      SEPA_ISOLATION_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=satflux_sepa_isolation_qa;Username=synthetic;Password=sepa-test-only
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 submodules/btcpayserver
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/tests/verify-btcpay-host.sh
      - run: bash scripts/verify-btcpay-host.sh
      - name: Create disposable Tickets test database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres satflux_tickets_ordering_ci
      - name: Create disposable SEPA isolation test database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE USER synthetic WITH PASSWORD 'sepa-test-only';"
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres -O synthetic satflux_sepa_isolation_qa
      - name: Tickets client regression tests
        run: node --test Plugins/BTCPayServer.Plugins.SatfluxTickets.Tests/TicketSalesClientTests.cjs
      - name: Build exact host and maintained plugins
        shell: bash
        run: |
          set -euo pipefail
          dotnet build submodules/btcpayserver/BTCPayServer/BTCPayServer.csproj -c Release -m:1 -p:StaticWebAssetsEnabled=false
          for plugin in BTCPayRaffle CashuMelt SepaInstantQr SatfluxTickets LnAddressConnect Blitz Flash EmailConfirm; do
            dotnet build "Plugins/BTCPayServer.Plugins.$plugin/BTCPayServer.Plugins.$plugin.csproj" -c Release -m:1 -p:BuildProjectReferences=false
          done
      - name: Existing and security regression tests
        shell: bash
        run: |
          set -euo pipefail
          for project in Plugins/*.Tests/*.csproj; do
            dotnet test "$project" -c Release -m:1 -p:BuildProjectReferences=false --verbosity minimal
          done
